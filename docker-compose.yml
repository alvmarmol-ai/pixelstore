version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: pixelstore_db
    restart: always
    environment:
      MYSQL_DATABASE: pixelstore
      MYSQL_ROOT_PASSWORD: secretpassword
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pixelstore_backend
    restart: always
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    ports:
      - "9000:9000"
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=pixelstore
      - DB_USERNAME=root
      - DB_PASSWORD=secretpassword
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pixelstore_frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  db_data: